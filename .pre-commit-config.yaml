exclude: '^(experiment/)'
repos:
-   repo: builtin
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-added-large-files
        args: ["--maxkb=1024"]
    -   id: detect-private-key
    -   id: check-merge-conflict
# Ruff and pyrefly run from the uv-locked versions in application/uv.lock (same as CI).
-   repo: local
    hooks:
    -   id: ruff-check
        name: ruff check
        entry: bash -c 'PATH="$HOME/.local/bin:$PATH"; if [ -x application/.venv/bin/ruff ]; then exec application/.venv/bin/ruff check --config application/pyproject.toml --fix "$@"; else exec uv run --project application --frozen ruff check --config application/pyproject.toml --fix "$@"; fi' --
        language: system
        types: [python]
    -   id: ruff-format
        name: ruff format
        entry: bash -c 'PATH="$HOME/.local/bin:$PATH"; if [ -x application/.venv/bin/ruff ]; then exec application/.venv/bin/ruff format --config application/pyproject.toml "$@"; else exec uv run --project application --frozen ruff format --config application/pyproject.toml "$@"; fi' --
        language: system
        types: [python]
    -   id: pyrefly
        name: pyrefly check
        entry: bash -c 'PATH="$HOME/.local/bin:$PATH"; if [ -x application/.venv/bin/pyrefly ]; then cd application && SITE_PKGS=$(echo .venv/lib/python*/site-packages | awk "{print \$1}") && exec ./.venv/bin/pyrefly check --site-package-path "$SITE_PKGS" --python-version 3.13 --min-severity=warn src; else cd application && exec uv run --frozen pyrefly check --min-severity=warn src; fi' --
        language: system
        types: [python]
        pass_filenames: false
    -   id: web-format
        name: web format (Biome)
        entry: npm --prefix web run format
        language: system
        files: ^web/
        pass_filenames: false
    -   id: web-lint
        name: web lint (Biome, tsc --noEmit, WCAG contrast)
        entry: npm --prefix web run lint
        language: system
        files: ^web/
        pass_filenames: false
    -   id: web-build
        name: web build (tsc -p tsconfig.build.json)
        entry: npm --prefix web run build
        language: system
        files: ^web/
        pass_filenames: false
    -   id: web-test
        name: web unit & integration tests (Vitest)
        entry: npm --prefix web run test
        language: system
        files: ^web/
        pass_filenames: false
