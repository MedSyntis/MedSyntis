name: Issue Governance & Completeness Check

on:
  issues:
    types: [opened, edited, reopened, milestoned, demilestoned]

permissions:
  issues: write

jobs:
  triage-completeness:
    name: Validate Story / Feature / Bug Completeness
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate issue structure and apply governance labels
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";
            const title = issue.title || "";
            const currentLabels = issue.labels.map(l => l.name);

            const labelsToAdd = new Set();
            const labelsToRemove = new Set();
            const reasons = [];

            // 1. Resolve canonical issue type and enforce strict mutual exclusivity of type:* labels
            const allTypeLabels = ["type:story", "type:feature", "type:bug"];
            let resolvedType = null;

            if (/^\[Story\]/i.test(title)) {
              resolvedType = "type:story";
            } else if (/^\[Feature\]/i.test(title)) {
              resolvedType = "type:feature";
            } else if (/^\[Bug\]/i.test(title)) {
              resolvedType = "type:bug";
            } else {
              const existingTypes = allTypeLabels.filter(t => currentLabels.includes(t));
              if (existingTypes.length === 1) {
                resolvedType = existingTypes[0];
              } else if (existingTypes.length > 1) {
                reasons.push("Issue type labels (`type:story`, `type:feature`, `type:bug`) are mutually exclusive. Keep exactly one `type:*` label.");
              }
            }

            if (resolvedType) {
              labelsToAdd.add(resolvedType);
              for (const t of allTypeLabels) {
                if (t !== resolvedType) {
                  labelsToRemove.add(t);
                }
              }
            }

            const isStory = resolvedType === "type:story";
            const isFeature = resolvedType === "type:feature";
            const isBug = resolvedType === "type:bug";

            // 2. Auto-detect domain, scope, and persona labels from YAML form selections
            const autoDetectTokens = [
              "domain:oncology",
              "domain:sma",
              "domain:cross-domain",
              "scope:domain",
              "scope:agents-rag",
              "scope:api",
              "scope:ui-web",
              "scope:ui-streamlit",
              "scope:infra",
              "scope:ci",
              "persona:physician",
              "persona:secretary"
            ];
            for (const token of autoDetectTokens) {
              if (body.includes(token)) {
                labelsToAdd.add(token);
              }
            }

            // 3. Evaluate completeness rules
            // Check for open clinical/PO questions
            const hasOpenQuestions =
              body.includes("❓") ||
              body.includes("🩺") ||
              /open\s+questions?|questions?\s+(ouvertes?|restantes?)/i.test(body);

            if (hasOpenQuestions) {
              labelsToAdd.add("status:needs-po-validation");
              reasons.push("Open business or clinical questions (`❓` / `🩺`) remain to be validated with the Product Owner / Clinician.");
            } else {
              labelsToRemove.add("status:needs-po-validation");
            }

            // Check for incomplete placeholders in DoD or explicit 'status:to-complete' selection
            if (
              body.includes("[TBD") ||
              body.includes("[À préciser") ||
              body.includes("To Complete (status:to-complete)")
            ) {
              reasons.push("The ticket is explicitly marked as `To Complete` or still contains `[TBD]` placeholders in its Definition of Done.");
            }

            if (isStory) {
              // Story must be paired with a GitHub Milestone
              if (!Boolean(issue.milestone)) {
                reasons.push("A **Story** must be associated with a matching GitHub **Milestone** to group and track child **Feature** tickets.");
              }

              // Story must have all Product Owner Validation checkboxes checked (zero unchecked '- [ ]')
              const poSectionMatch = body.match(/###\s*.*Product Owner Validation[\s\S]*?(?=\n###\s|$)/i);
              if (!poSectionMatch || /- \[\s\]/.test(poSectionMatch[0])) {
                reasons.push("All **Product Owner Validation** checkboxes must be checked (`- [x]`) before a **Story** can transition to `status:ready`.");
              }

              // Story must only contain business need (no fenced code blocks, API routes, or technical file paths)
              if (
                body.includes("```") ||
                /application\/src\/|web\/src\/|dist\/docker\/|\/api\/v1\//i.test(body)
              ) {
                reasons.push("A **Story** must strictly contain the business need only (no fenced code blocks ` ``` `, API routes `/api/v1/`, or file paths such as `application/src/`, `web/src/`, `dist/docker/`). Move technical details into child **Feature** tickets.");
              }
            }

            if (isFeature) {
              // Feature must BOTH reference a parent Story ('Parent Story: #XX') AND be assigned to a Milestone
              const hasParentStoryRef = /Parent Story:\s*#\d+/i.test(body);
              const hasMilestone = Boolean(issue.milestone);
              if (!hasParentStoryRef || !hasMilestone) {
                reasons.push("A **Feature** must explicitly reference a parent **Story** (`Parent Story: #XX`) **and** be assigned to the corresponding GitHub **Milestone**.");
              }
              // Feature must have a DoD section
              if (!/Definition of Done|Acceptance Criteria/i.test(body)) {
                reasons.push("A **Feature** must include a verifiable **Definition of Done (DoD)** section.");
              }
            }

            if (isBug) {
              if (!/Definition of Done/i.test(body) || !/Bug Description|Actual Behavior/i.test(body)) {
                reasons.push("A **Bug** must include both a **Bug Description** and a **Definition of Done (DoD)**.");
              }
            }

            // 4. Determine final status label
            if (reasons.length > 0) {
              labelsToAdd.add("status:to-complete");
              labelsToRemove.add("status:ready");
            } else if (isStory || isFeature || isBug) {
              labelsToAdd.add("status:ready");
              labelsToRemove.add("status:to-complete");
            }

            // 5. Apply label updates
            const finalLabelsToAdd = [...labelsToAdd].filter(l => !currentLabels.includes(l));
            if (finalLabelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: finalLabelsToAdd
              });
            }

            for (const labelToRemove of labelsToRemove) {
              if (currentLabels.includes(labelToRemove)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: labelToRemove
                  });
                } catch (err) {
                  console.log(`Could not remove label ${labelToRemove}: ${err.message}`);
                }
              }
            }

            // 6. Write workflow summary
            core.summary
              .addHeading(`Issue Governance Check — #${issue.number}`)
              .addList(
                reasons.length > 0
                  ? reasons
                  : ["✅ Ticket is complete, concise, and ready for development (`status:ready`)."]
              )
              .write();
