version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "scope:ci"
      - "scope:infra"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"

  # Maintain Python dependencies in the application directory
  - package-ecosystem: "uv"
    directory: "/application"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "scope:api"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Maintain Python dependencies in the GCS smoke-test utility directory
  - package-ecosystem: "uv"
    directory: "/dist/gcloud_test/gcs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "scope:infra"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Maintain Node.js / TypeScript dependencies in the web directory
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "scope:ui-web"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Maintain Docker dependencies in the dist/docker directory (Dockerfile, Dockerfile.api & Dockerfile.web)
  - package-ecosystem: "docker"
    directory: "/dist/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "scope:infra"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Maintain Docker Compose image versions in dist/docker/compose
  - package-ecosystem: "docker-compose"
    directory: "/dist/docker/compose"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "scope:infra"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Milvus Standalone v3.0 relies on etcd 3.7.x; jumping minor/major etcd series can break existing etcd data volumes
      - dependency-name: "quay.io/coreos/etcd"
        versions:
          - ">= 3.8.0"
