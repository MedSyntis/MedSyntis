x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    compress: "true"

services:

  mongod:
    image: mongodb/mongodb-community-server:9.0-ubuntu2204
    container_name: medsyntis-mongod
    oom_score_adj: -500
    restart: unless-stopped
    logging: *default-logging
    entrypoint:
      - python3
      - -c
      - "import platform, sys; platform.release = lambda: '6.18.0'; sys.argv = ['/usr/local/bin/docker-entrypoint.py'] + sys.argv[1:]; exec(open('/usr/local/bin/docker-entrypoint.py').read())"
    command:
      - "mongod"
      - "--bind_ip_all"
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      HOME: "/tmp"
      MONGO_INITDB_ROOT_USERNAME: ${APP_MONGODB_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${APP_MONGODB_PASSWORD:-root}
      MONGODB_INITDB_ROOT_USERNAME: ${APP_MONGODB_USER:-root}
      MONGODB_INITDB_ROOT_PASSWORD: ${APP_MONGODB_PASSWORD:-root}
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-/data/medsyntis/common}/mongodb:/data/db
      - ${DOCKER_VOLUME_DIRECTORY:-/data/medsyntis/common}/mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - search-community

  # Local Ollama inference server (bound strictly to loopback 127.0.0.1)
  ollama:
    image: ollama/ollama:0.40.15
    restart: always
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - /data/ollama:/root/.ollama
    devices:
      - nvidia.com/gpu=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - "dev"
      - "ollama"

  llama-cpp-chat:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12
    container_name: llama-cpp-chat-server
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - DO_NOT_TRACK=1
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${HOME:-~}/.cache/huggingface:/root/.cache/huggingface:z
      - ./model-config:/models-config
    ipc: host
    devices:
      - nvidia.com/gpu=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      -hf Qwen/Qwen3-14B-GGUF:Q4_K_M
      --port 8080
      --host 0.0.0.0
      -c 40960
      -ngl 99
      -fa
      --temp 1.0
      --top-p 0.95
      --top-k 40
      --min-p 0
      --cache-type-k q4_0
      --cache-type-v q4_0
      --jinja
      -n 32768
      --presence-penalty 2.0
      --repeat-penalty 1.0
      --no-context-shift
    networks:
      - search-community
    restart: unless-stopped
    profiles:
      - "local"
      - "llamacpp-chat"

  llama-cpp-embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-cpp-embeddings-server
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - DO_NOT_TRACK=1
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ${HOME:-~}/.cache/huggingface:/root/.cache/huggingface:z
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --hf-repo gpustack/bge-m3-GGUF
      --hf-file bge-m3-FP16.gguf
      --port 8080
      --host 0.0.0.0
      --embedding
      -c 8192
      -b 8192
      -ub 8192
    networks:
      - search-community
    restart: unless-stopped
    profiles:
      - "dev"
      - "llamacpp"

  litellm:
    image: ghcr.io/berriai/litellm:v1.109.0
    container_name: litellm-proxy
    network_mode: "host"
    environment:
      LITELLM_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY: "true"
      LITELLM_TELEMETRY: "False"
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "1"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--host", "127.0.0.1", "--port", "4000"]
    restart: unless-stopped

networks:
  search-community:
    name: search-community
