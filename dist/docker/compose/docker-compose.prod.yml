x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    compress: "true"

x-telemetry-off: &telemetry-off
  LITELLM_TELEMETRY: "False"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  ANONYMIZED_TELEMETRY: "False"
  SCARF_NO_ANALYTICS: "true"
  DO_NOT_TRACK: "1"

x-ui-env: &ui-env
  <<: *telemetry-off
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
  APP_DEV_MODE: "false"
  APP_AUTH_MODE: "oauth_proxy"
  APP_LANGUAGE: ${APP_LANGUAGE:-french}
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
  APP_LOG_TYPE: ${APP_LOG_TYPE:-json}
  APP_LOG_MAX_BYTES: ${APP_LOG_MAX_BYTES:-10485760}
  APP_LOG_BACKUP_COUNT: ${APP_LOG_BACKUP_COUNT:-5}
  APP_CONFIGLLM_TYPE: "LiteLLM"
  APP_CONFIGLLM_URL: "http://litellm"
  APP_CONFIGLLM_PORT: "4000"
  APP_CONFIGLLM_EMBEDDINGS_PORT: "4000"
  APP_CONFIGLLM_MODELS: "openai/agents"
  APP_CONFIGLLM_EMBEDDINGS: "openai/embeddings"
  APP_CONFIGLLM_API_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set in .env.prod}
  APP_MONGODB_HOST: "mongod"
  APP_MONGODB_PORT: "27017"
  APP_MONGODB_USER: ${APP_MONGODB_USER:-root}
  APP_MONGODB_PASSWORD: ${APP_MONGODB_PASSWORD:?APP_MONGODB_PASSWORD must be set in .env.prod}
  APP_MILVUSDB_HOST: "milvus-standalone"
  APP_MILVUSDB_PORT: "19530"
  APP_ALLOWED_DOMAINS: ${APP_ALLOWED_DOMAINS:-oncology,sma}
  APP_QUEUE_ENABLED: ${APP_QUEUE_ENABLED:-true}
  APP_QUEUE_HARDWARE_PROFILE: ${APP_QUEUE_HARDWARE_PROFILE:-l4_24gb}
  APP_QUEUE_BATCH_SIZE: ${APP_QUEUE_BATCH_SIZE:-1}
  APP_QUEUE_API_URL: ${APP_QUEUE_API_URL:-http://medsyntis-api:8000}
  APP_ADMIN_USERS: ${APP_ADMIN_USERS:-}
  APP_API_TOKEN: ${APP_API_TOKEN:?APP_API_TOKEN must be set in .env.prod}
  APP_PROXY_SECRET: ${APP_PROXY_SECRET:?APP_PROXY_SECRET must be set in .env.prod}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
  OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
  OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-60000}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
  OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext,baggage}

x-ui-common: &ui-common
  image: ${MEDSYNTIS_IMAGE:-ghcr.io/medsyntis/medsyntis}:${MEDSYNTIS_TAG:-latest}
  restart: unless-stopped
  logging: *default-logging
  userns_mode: "keep-id"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    - ${DOCKER_VOLUME_DIRECTORY:-/data/medsyntis/common}/logs:/var/log/medsyntis
  depends_on:
    mongod:
      condition: service_healthy
    litellm:
      condition: service_started
  networks:
    - ingress_net
    - backend_internal
    - milvus

services:

  mongod:
    image: mongodb/mongodb-community-server:9.0-ubuntu2204
    container_name: medsyntis-mongod
    oom_score_adj: -500
    restart: unless-stopped
    logging: *default-logging
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - python3
      - -c
      - "import platform, sys; platform.release = lambda: '6.18.0'; sys.argv = ['/usr/local/bin/docker-entrypoint.py'] + sys.argv[1:]; exec(open('/usr/local/bin/docker-entrypoint.py').read())"
    command:
      - "mongod"
      - "--bind_ip_all"
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      <<: *telemetry-off
      HOME: "/tmp"
      MONGO_INITDB_ROOT_USERNAME: ${APP_MONGODB_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${APP_MONGODB_PASSWORD:?APP_MONGODB_PASSWORD must be set in .env.prod}
      MONGODB_INITDB_ROOT_USERNAME: ${APP_MONGODB_USER:-root}
      MONGODB_INITDB_ROOT_PASSWORD: ${APP_MONGODB_PASSWORD:?APP_MONGODB_PASSWORD must be set in .env.prod}
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-/data/medsyntis/common}/mongodb:/data/db
      - ${DOCKER_VOLUME_DIRECTORY:-/data/medsyntis/common}/mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend_internal

  # ─── Local Reasoning LLM on NVIDIA L4 GPU (24 GB VRAM) ──────────────────────
  # Model: Ornith-1.5-35B-A3B-IQ4_XS (~19.3 GB weights + ~1.5 GB q4_0 KV cache)
  llama-cpp-chat:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12
    container_name: llama-cpp-chat-server
    restart: unless-stopped
    logging: *default-logging
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *telemetry-off
      NVIDIA_VISIBLE_DEVICES: "all"
      GGML_CUDA_PDL: "0"
      GGML_CUDA_DISABLE_GRAPHS: "0"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-/data/medsyntis/common}/models:/models:ro
      - ./model-config:/models-config:ro
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint:
      - /bin/sh
      - -c
      - |
        rm -rf /usr/local/cuda*/compat && ldconfig 2>/dev/null || true
        SERVER_BIN="/app/llama-server"
        [ -x "$$SERVER_BIN" ] || SERVER_BIN="llama-server"
        if [ -f "/models/Ornith-1.5-35B-A3B-IQ4_XS.gguf" ]; then
          MODEL_ARGS="-m /models/Ornith-1.5-35B-A3B-IQ4_XS.gguf"
        else
          echo "ERROR: Missing local reasoning GGUF weights (/models/Ornith-1.5-35B-A3B-IQ4_XS.gguf)." >&2
          echo "Runtime HuggingFace downloads are forbidden in production. Run 'make pull-models-prod' first." >&2
          exit 1
        fi
        exec $$SERVER_BIN $$MODEL_ARGS "$$@"
      - --
    command:
      - "--port"
      - "8080"
      - "--host"
      - "0.0.0.0"
      - "-c"
      - "${LLM_CTX_SIZE:-64000}"
      - "-n"
      - "8192"
      - "-ngl"
      - "99"
      - "--flash-attn"
      - "on"
      - "--load-mode"
      - "none"
      - "-b"
      - "4096"
      - "-ub"
      - "1024"
      - "-t"
      - "6"
      - "-np"
      - "1"
      - "--temp"
      - "0.6"
      - "--top-p"
      - "0.95"
      - "--top-k"
      - "20"
      - "--min-p"
      - "0"
      - "--presence-penalty"
      - "1.5"
      - "--repeat-penalty"
      - "1.0"
      - "--jinja"
      - "--reasoning-format"
      - "deepseek"
      - "--reasoning-budget"
      - "6144"
      - "--reasoning-budget-message"
      - "\nOkay, I have enough information to answer."
      - "--no-context-shift"
      - "--no-warmup"
      - "--cache-type-k"
      - "q4_0"
      - "--cache-type-v"
      - "q4_0"
      - "--cache-ram"
      - "${LLM_CACHE_RAM_MIB:-2048}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
    networks:
      - backend_internal

  # ─── Local Embeddings Server (bge-m3 on CPU to preserve L4 24 GB VRAM) ──────
  llama-cpp-embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-cpp-embeddings-server
    restart: unless-stopped
    logging: *default-logging
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *telemetry-off
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-/data/medsyntis/common}/models:/models:ro
    ipc: host
    entrypoint:
      - /bin/sh
      - -c
      - |
        SERVER_BIN="/app/llama-server"
        [ -x "$$SERVER_BIN" ] || SERVER_BIN="llama-server"
        if [ -f "/models/bge-m3-Q4_K_M.gguf" ]; then
          MODEL_ARGS="-m /models/bge-m3-Q4_K_M.gguf"
        elif [ -f "/models/bge-m3-F16.gguf" ]; then
          MODEL_ARGS="-m /models/bge-m3-F16.gguf"
        elif [ -f "/models/bge-m3-FP16.gguf" ]; then
          MODEL_ARGS="-m /models/bge-m3-FP16.gguf"
        else
          echo "ERROR: Missing local embedding GGUF weights in /models (expected bge-m3-Q4_K_M.gguf, bge-m3-F16.gguf, or bge-m3-FP16.gguf)." >&2
          echo "Runtime HuggingFace downloads are forbidden in production. Run 'make pull-models-prod' first." >&2
          exit 1
        fi
        exec $$SERVER_BIN $$MODEL_ARGS "$$@"
      - --
    command:
      - "--port"
      - "8080"
      - "--host"
      - "0.0.0.0"
      - "--embedding"
      - "-c"
      - "8192"
      - "-b"
      - "8192"
      - "-ub"
      - "8192"
      - "-ngl"
      - "0"
      - "-t"
      - "4"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - backend_internal

  # ─── Unified LiteLLM Gateway (Chat + Embeddings, zero external telemetry) ───
  litellm:
    image: ghcr.io/berriai/litellm:v1.109.0
    container_name: litellm-proxy
    restart: unless-stopped
    logging: *default-logging
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *telemetry-off
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set in .env.prod}
      LITELLM_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY: "false"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm-config.prod.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - llama-cpp-chat
      - llama-cpp-embeddings
    networks:
      - backend_internal

  # ─── Legacy MedSyntis Streamlit UI (Optional deployment: --profile streamlit) ──
  medsyntis-ui-oncology:
    <<: *ui-common
    container_name: medsyntis-ui-oncology
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      <<: *ui-env
      APP_DOMAIN: "oncology"
      APP_LOG_FILE: "/var/log/medsyntis/medsyntis-oncology.log"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-/data/medsyntis/common}/logs:/var/log/medsyntis
      - ${HOST_ONCOLOGIC_DIR:-/data/medsyntis/oncologic}/mtd:/app/application/ressources/PatientMDTForm/oncology
      - ${HOST_ONCOLOGIC_DIR:-/data/medsyntis/oncologic}/documents:/app/application/ressources/documents/oncology
    profiles:
      - "streamlit"

  medsyntis-ui-sma:
    <<: *ui-common
    container_name: medsyntis-ui-sma
    ports:
      - "127.0.0.1:8502:8501"
    environment:
      <<: *ui-env
      APP_DOMAIN: "sma"
      APP_LOG_FILE: "/var/log/medsyntis/medsyntis-sma.log"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-/data/medsyntis/common}/logs:/var/log/medsyntis
      - ${HOST_SMA_DIR:-/data/medsyntis/sma}/mtd:/app/application/ressources/PatientMDTForm/sma
      - ${HOST_SMA_DIR:-/data/medsyntis/sma}/documents:/app/application/ressources/documents/sma
    profiles:
      - "streamlit"

  # ─── Cross-Domain FastAPI Backend & Integrated GPU PriorityQueue ────────────
  medsyntis-api:
    <<: *ui-common
    image: ${MEDSYNTIS_API_IMAGE:-ghcr.io/medsyntis/medsyntis-api}:${MEDSYNTIS_TAG:-latest}
    container_name: medsyntis-api
    command: ["uv", "run", "--no-sync", "python", "app-api.py"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *ui-env
      APP_ALLOWED_DOMAINS: ${APP_ALLOWED_DOMAINS:-oncology,sma}
      APP_QUEUE_API_URL: ""
      APP_LOG_FILE: "/var/log/medsyntis/medsyntis-api.log"
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_API:-medsyntis-api}
      APP_ADMIN_USERS: ${APP_ADMIN_USERS:-}
      APP_ALLOW_REMOTE_LLM: ${APP_ALLOW_REMOTE_LLM:-false}
      APP_API_HOST: ${APP_API_HOST:-0.0.0.0}
      APP_API_PORT: ${APP_API_PORT:-8000}
      APP_API_WORKERS: ${APP_API_WORKERS:-1}
      APP_API_TIMEOUT_KEEP_ALIVE: ${APP_API_TIMEOUT_KEEP_ALIVE:-30}
      APP_API_PROXY_HEADERS: ${APP_API_PROXY_HEADERS:-true}
      APP_API_FORWARDED_ALLOW_IPS: ${APP_API_FORWARDED_ALLOW_IPS:-127.0.0.1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      APP_API_DOCS_ENABLED: ${APP_API_DOCS_ENABLED:-false}
      APP_API_DOCS_REQUIRE_AUTH: ${APP_API_DOCS_REQUIRE_AUTH:-true}
      APP_API_CORS_ENABLED: ${APP_API_CORS_ENABLED:-true}
      APP_API_CORS_ORIGINS: ${APP_API_CORS_ORIGINS:-https://oncologic.${PROD_BASE_DOMAIN:-medsyntis.fr},https://sma.${PROD_BASE_DOMAIN:-medsyntis.fr},https://oncologic-st.${PROD_BASE_DOMAIN:-medsyntis.fr},https://sma-st.${PROD_BASE_DOMAIN:-medsyntis.fr}}
      APP_API_CORS_ORIGIN_REGEX: ${APP_API_CORS_ORIGIN_REGEX:-}
      APP_API_CORS_ALLOW_CREDENTIALS: ${APP_API_CORS_ALLOW_CREDENTIALS:-true}
      APP_API_CORS_ALLOW_METHODS: ${APP_API_CORS_ALLOW_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
      APP_API_CORS_ALLOW_HEADERS: ${APP_API_CORS_ALLOW_HEADERS:-Authorization,Content-Type,X-API-Key,X-MedSyntis-Domain,X-MedSyntis-User,X-MedSyntis-User-Name,X-MedSyntis-Proxy-Secret,X-Request-ID,traceparent,tracestate,Accept,Origin,X-Requested-With}
      APP_API_CORS_EXPOSE_HEADERS: ${APP_API_CORS_EXPOSE_HEADERS:-X-MedSyntis-Domain,X-Request-ID,X-Trace-Id,Content-Disposition}
      APP_API_CORS_MAX_AGE: ${APP_API_CORS_MAX_AGE:-600}
      APP_API_TRUSTED_HOSTS: ${APP_API_TRUSTED_HOSTS:-127.0.0.1,localhost,medsyntis-api,*.${PROD_BASE_DOMAIN:-medsyntis.fr}}
      APP_API_FORCE_HTTPS: ${APP_API_FORCE_HTTPS:-false}
      APP_API_GZIP_ENABLED: ${APP_API_GZIP_ENABLED:-true}
      APP_API_GZIP_MINIMUM_SIZE: ${APP_API_GZIP_MINIMUM_SIZE:-1000}
      APP_API_SECURITY_HEADERS_ENABLED: ${APP_API_SECURITY_HEADERS_ENABLED:-true}
      APP_API_HSTS_ENABLED: ${APP_API_HSTS_ENABLED:-true}
      APP_API_HSTS_MAX_AGE: ${APP_API_HSTS_MAX_AGE:-31536000}
      APP_API_HSTS_INCLUDE_SUBDOMAINS: ${APP_API_HSTS_INCLUDE_SUBDOMAINS:-true}
      APP_API_CSP_POLICY: ${APP_API_CSP_POLICY:-default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'}
      APP_API_FRAME_OPTIONS: ${APP_API_FRAME_OPTIONS:-DENY}
      APP_API_REFERRER_POLICY: ${APP_API_REFERRER_POLICY:-no-referrer}
      APP_API_PERMISSIONS_POLICY: ${APP_API_PERMISSIONS_POLICY:-camera=(), microphone=(), geolocation=(), payment=(), usb=()}
      APP_API_CACHE_CONTROL: ${APP_API_CACHE_CONTROL:-no-store, no-cache, must-revalidate, max-age=0}
      APP_API_COOP_POLICY: ${APP_API_COOP_POLICY:-same-origin}
      APP_API_CORP_POLICY: ${APP_API_CORP_POLICY:-same-origin}
      APP_API_MAX_BODY_BYTES: ${APP_API_MAX_BODY_BYTES:-52428800}
      APP_API_RATE_LIMIT_ENABLED: ${APP_API_RATE_LIMIT_ENABLED:-true}
      APP_API_RATE_LIMIT_REQUESTS: ${APP_API_RATE_LIMIT_REQUESTS:-1200}
      APP_API_RATE_LIMIT_WINDOW_SECONDS: ${APP_API_RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-/data/medsyntis/common}/logs:/var/log/medsyntis
      - ${HOST_ONCOLOGIC_DIR:-/data/medsyntis/oncologic}/mtd:/app/application/ressources/PatientMDTForm/oncology
      - ${HOST_ONCOLOGIC_DIR:-/data/medsyntis/oncologic}/documents:/app/application/ressources/documents/oncology
      - ${HOST_SMA_DIR:-/data/medsyntis/sma}/mtd:/app/application/ressources/PatientMDTForm/sma
      - ${HOST_SMA_DIR:-/data/medsyntis/sma}/documents:/app/application/ressources/documents/sma
    networks:
      - backend_internal
      - milvus

  # ─── Material Design 3 Web UI (Primary Multi-Domain Fastify BFF) ────────────
  medsyntis-web:
    image: ${MEDSYNTIS_WEB_IMAGE:-ghcr.io/medsyntis/medsyntis-web}:${MEDSYNTIS_TAG:-latest}
    container_name: medsyntis-web
    restart: unless-stopped
    logging: *default-logging
    userns_mode: "keep-id"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      <<: *telemetry-off
      NODE_ENV: "production"
      APP_DEV_MODE: "false"
      APP_AUTH_MODE: "oauth_proxy"
      WEB_FAKE_API_FALLBACK: "false"
      HOST_WEB: "0.0.0.0"
      PORT_WEB: "3000"
      APP_API_URL: ${APP_QUEUE_API_URL:-http://medsyntis-api:8000}
      APP_ALLOWED_DOMAINS: ${APP_ALLOWED_DOMAINS:-oncology,sma}
      APP_LANGUAGE: ${APP_LANGUAGE:-french}
      APP_ADMIN_USERS: ${APP_ADMIN_USERS:-}
      APP_ALLOW_REMOTE_LLM: ${APP_ALLOW_REMOTE_LLM:-false}
      APP_API_TOKEN: ${APP_API_TOKEN:?APP_API_TOKEN must be set in .env.prod}
      APP_PROXY_SECRET: ${APP_PROXY_SECRET:?APP_PROXY_SECRET must be set in .env.prod}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_WEB:-medsyntis-web}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-60000}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext,baggage}
    depends_on:
      - medsyntis-api
    networks:
      - ingress_net
      - backend_internal

  # ─── Optional Local MLflow OTLP Tracing Server (--profile mlflow) ───────────
  mlflow:
    image: ${MLFLOW_IMAGE:-ghcr.io/mlflow/mlflow:v3.1.1}
    container_name: medsyntis-mlflow
    restart: unless-stopped
    logging: *default-logging
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    environment:
      <<: *telemetry-off
      MLFLOW_DISABLE_TELEMETRY: "true"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-/data/medsyntis/common}/mlflow:/mlflow
    command:
      - "mlflow"
      - "server"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "5000"
      - "--backend-store-uri"
      - "sqlite:////mlflow/mlflow.db"
      - "--default-artifact-root"
      - "/mlflow/artifacts"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend_internal
    profiles:
      - "mlflow"

  # ─── OAuth2 Proxy (Zero-Trust SSO across *.medsyntis.fr: OIDC / Pro Sante Connect / GitHub) ──
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
    container_name: medsyntis-oauth2-proxy
    restart: unless-stopped
    logging: *default-logging
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:4180:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: ${OAUTH2_PROXY_PROVIDER:-github}
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_PROXY_OIDC_ISSUER_URL:-}
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      OAUTH2_PROXY_REDIRECT_URL: "${OAUTH2_PROXY_REDIRECT_URL:-https://sso.medsyntis.fr/oauth2/callback}"
      OAUTH2_PROXY_COOKIE_DOMAINS: ".${PROD_BASE_DOMAIN:-medsyntis.fr}"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".${PROD_BASE_DOMAIN:-medsyntis.fr}"
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?OAUTH2_PROXY_CLIENT_ID must be set in .env.prod}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?OAUTH2_PROXY_CLIENT_SECRET must be set in .env.prod}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?OAUTH2_PROXY_COOKIE_SECRET must be set in .env.prod}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_PROXY_EMAIL_DOMAINS:-*}
      OAUTH2_PROXY_GITHUB_ORG: ${OAUTH2_PROXY_GITHUB_ORG:-}
      OAUTH2_PROXY_GITHUB_TEAM: ${OAUTH2_PROXY_GITHUB_TEAM:-}
      OAUTH2_PROXY_GITHUB_USERS: ${OAUTH2_PROXY_GITHUB_USERS:-}
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_HOST_HEADER: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: "lax"
      OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"
    depends_on:
      - medsyntis-web
    networks:
      - ingress_net

  # ─── TLS Reverse Proxy (Caddy — Automatic TLS + Zero-Trust Header Injection) ──
  caddy:
    image: caddy:2.11.9-alpine
    container_name: medsyntis-caddy
    restart: unless-stopped
    logging: *default-logging
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PROD_BASE_DOMAIN: ${PROD_BASE_DOMAIN:-medsyntis.fr}
      APP_PROXY_SECRET: ${APP_PROXY_SECRET:?APP_PROXY_SECRET must be set in .env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DOCKER_VOLUME_DIRECTORY:-/data/medsyntis/common}/caddy_data:/data
      - ${DOCKER_VOLUME_DIRECTORY:-/data/medsyntis/common}/caddy_config:/config
    depends_on:
      - oauth2-proxy
      - medsyntis-web
    networks:
      - ingress_net

networks:
  ingress_net:
    name: medsyntis-ingress
  backend_internal:
    name: medsyntis-backend-internal
    internal: true
  milvus:
    name: milvus
    external: true
